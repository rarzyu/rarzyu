name: Update README

on:
  schedule:
    # 毎週火曜 JST 6:00
    - cron: "0 21 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: README の自動更新欄を書き換える
        run: node scripts/update-readme.mjs

      - name: 変わったときだけ commit・push する
        run: |
          if git diff --quiet -- README.md; then
            echo "README.md は変わっていません"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "README の自動更新（ブログ・アプリの最新版）"
          git push
